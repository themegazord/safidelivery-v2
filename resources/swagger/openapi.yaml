      type: object
      required:
        - descricao
        - tipo
      properties:
        codigo_pdv:
          type: integer
          nullable: true
          example: 1
          description: Código identificador da forma de pagamento no PDV
        descricao:
          type: string
          maxLength: 100
          example: Pix
          description: Nome descritivo da forma de pagamento
        tipo:
          type: string
          enum: [PIX, DIN, CTD, CTC, VRE, VIR]
          example: PIX
          description: >
            Categoria da forma de pagamento:
            PIX = Pix,
            DIN = Dinheiro,
            CTD = Cartão de débito,
            CTC = Cartão de crédito,
            VRE = Vale refeição,
            VIR = Crédito virtual (cashback)
        ativo:
          type: boolean
          example: true
          description: >
            Indica se a forma de pagamento está ativa.
            Quando não informado, o padrão é true.
