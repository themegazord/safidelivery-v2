  /pedidos/diario:
    post:
      summary: Lista todos os pedidos entregues que ainda não foram consultados.
      operationId: listaPedidosEntreguesDiarios
      tags:
        - pedidos
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DadosConsultaListaPedidosDiario'
        required: true
      responses:
        '200':
          description: Uma lista de pedidos entregues feitos no dia da consulta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PedidosEntregues'
        '422':
          description: Todos os erros possiveis nessa validação.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidacaoConsultaPedidosDiario'
  /empresa/cadastro:
    post:
      summary: Cadastra uma nova empresa no sistema
      operationId: cadastroEmpresa
      tags:
        - empresa
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CadastroEmpresaRequest'
      responses:
        '201':
          description: Empresa cadastrada com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  sucesso:
                    type: string
                    example: Empresa cadastrada com sucesso!
        '422':
          description: Erro de validacao
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidacaoCadastroEmpresa'
        '500':
          description: Erro interno do servidor
          content:
            application/json:
              schema:
                type: object
                properties:
                  erro:
                    type: string
                    example: Mensagem de erro interno
  /empresa/formapgto:
    post:
      summary: Cadastra ou atualiza formas de pagamento da empresa
      description: >
        Realiza upsert das formas de pagamento com base no `codigo_pdv`.
        Se já existir uma forma com o mesmo `codigo_pdv` para a empresa, ela será atualizada. Caso contrário, será criada.
      operationId: upsertFormaPgto
      tags:
        - empresa
      parameters:
        - in: header
          name: companyToken
          required: true
          schema:
            type: string
          description: Token da empresa necessário para autenticação
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertFormaPgtoRequest'
            example:
              formas:
                - codigo_pdv: 1
                  descricao: Pix
                  tipo: PIX
                  ativo: true
                - codigo_pdv: 2
                  descricao: Dinheiro
                  tipo: DIN
                  ativo: true
                - codigo_pdv: 3
                  descricao: Cartão de Débito
                  tipo: CTD
                  ativo: true
                - codigo_pdv: 4
                  descricao: Cartão de Crédito
                  tipo: CTC
                  ativo: false
                - codigo_pdv: 5
                  descricao: Vale Refeição
                  tipo: VRE
                  ativo: true
      responses:
        '201':
          description: Formas de pagamento cadastradas/atualizadas com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  mensagem:
                    type: string
                    example: Formas de pagamento cadastradas com sucesso
        '401':
          description: Erro de autenticação
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidacaoCompanyToken'
        '422':
          description: Erro de validação
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidacaoUpsertFormaPgto'
        '500':
          description: Erro interno do servidor
          content:
            application/json:
              schema:
                type: object
                properties:
                  erro:
                    type: string
                    example: Mensagem de erro interno
components:
  schemas:
    DadosConsultaListaPedidos:
      type: object
      required:
        - cnpj
        - data_hora
      properties:
        cnpj:
          type: string
        data_hora:
          type: string
    DadosConsultaListaPedidosDiario:
      type: object
      required:
        - cnpj
      properties:
        cnpj:
          type: string
    CabecalhoPedido:
      type: object
      properties:
        id:
          type: integer
          example: 15
        status:
          type: string
          example: entregue ou cancelado
        created_at:
          type: string
          format: date-time
          example: '2025-01-30T14:10:57.000000Z'
    PedidosEntregues:
      type: object
      properties:
        pedidos:
          type: array
          items:
            $ref: '#/components/schemas/CabecalhoPedido'
    PedidosDiarioEntregues:
      type: object
      properties:
        pedidos:
          type: array
          items:
            $ref: '#/components/schemas/CabecalhoPedido'
    Cliente:
      type: object
      properties:
        nome:
          type: string
          example: Giovanni Joaquim Moura
        email:
          type: string
          format: email
          example: giovannijoaquimmoura@unipsicotaubate.com.br
        cpf_cnpj:
          type: string
          example: '80867787899'
        telefone:
          type: string
          example: '87987079605'
        endereco:
          $ref: '#/components/schemas/Endereco'
    Endereco:
      type: object
      properties:
        logradouro:
          type: string
          example: Rua Carlos Eugênio Muniz
        numero:
          type: integer
          example: 15
        cep:
          type: string
          example: '55425970'
        bairro:
          type: string
          example: Centro
        cidade:
          type: string
          example: Paquevira
        uf:
          type: string
          example: PE
        complemento:
          type: string
          nullable: true
    Item:
      type: object
      properties:
        item_id:
          type: integer
          example: 13
        tipo:
          type: string
          example: I
        external_id:
          type: integer
          example: 2
        uuid:
          type: string
          example: 0f3ac57e-7e05-465d-aa3c-13431eb9ef44
        nome:
          type: string
          example: Marmita
        quantidade:
          type: integer
          example: 1
        preco_unitario:
          type: number
          format: float
          example: 10
          description: Preço unitário cobrado. Zero quando o item é um prêmio de fidelidade gratuito.
        preco_original:
          type: number
          format: float
          nullable: true
          example: null
          description: Preço original do item antes do desconto de fidelidade. Preenchido apenas quando item_premio é true.
        valor_desconto:
          type: number
          format: float
          nullable: true
          example: null
          description: Desconto aplicado neste item (preco_original - preco_unitario). Preenchido apenas quando item_premio é true.
        subtotal:
          type: number
          format: float
          example: 10
          description: Valor total cobrado por este item (preco_unitario × quantidade). Zero para itens prêmio gratuitos.
        item_premio:
          type: boolean
          example: false
          description: Indica se o item foi concedido como prêmio do programa de fidelidade (gratuito).
        complementos:
          type: array
          items:
            $ref: '#/components/schemas/Complemento'
    Complemento:
      type: object
      properties:
        external_id:
          type: integer
          example: 258
        complemento_id:
          type: integer
          example: 6
        uuid:
          type: string
          example: 3646a1e6-f3b9-429f-bdac-2cc607f51f3e
        grupo_complemento:
          type: string
          example: Precisa de ketchup?
        nome:
          type: string
          example: Queijo Coalho Grelhado
        quantidade:
          type: integer
          example: 1
        preco_unitario:
          type: number
          format: float
          example: 5
    ComplementoPedidoIfood:
      type: object
      properties:
        external_id:
          type: integer
        complemento_id:
          type: integer
        uuid:
          type: string
        grupo_complemento:
          type: string
        nome:
          type: string
        quantidade:
          type: integer
        preco_unitario:
          type: number
          format: float
    PagamentoItem:
      type: object
      properties:
        forma_pagamento:
          type: string
          example: Dinheiro
          description: Descrição da forma de pagamento
        tipo_pagamento:
          type: string
          enum: [PIX, DIN, CTD, CTC, VRE, VIR]
          example: DIN
          description: >
            Categoria da forma de pagamento:
            PIX = Pix,
            DIN = Dinheiro,
            CTD = Cartão de débito,
            CTC = Cartão de crédito,
            VRE = Vale refeição,
            VIR = Crédito virtual (cashback)
        codigo_pdv:
          type: integer
          nullable: true
          example: 5
          description: Código identificador da forma de pagamento no PDV. Null quando não cadastrado.
        valor:
          type: number
          format: float
          example: 40
        troco_para:
          type: number
          format: float
          nullable: true
          example: null
        valor_troco:
          type: number
          format: float
          nullable: true
          example: null
    Financeiro:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
          example: 64277299-d189-46e8-b260-3861d6d75539
        total:
          type: number
          format: float
          example: 40
        valor_desconto:
          type: number
          format: float
          nullable: true
          example: null
          description: >
            Soma de todos os descontos aplicados no pedido (cupom + cashback utilizado + fidelidade).
            Null quando nenhum desconto foi aplicado.
        cashback_gerado:
          type: number
          format: float
          nullable: true
          example: null
          description: Valor de cashback gerado por este pedido (crédito para uso futuro)
        data_vencimento_cashback:
          type: string
          format: date
          nullable: true
          example: null
          description: Data de vencimento do cashback gerado (formato Y-m-d). Null quando não há cashback gerado.
