openapi: 3.0.0
info:
  version: 1.0.0
  title: SAFI Delivery
  license:
    name: MIT
servers:
  - url: http://localhost:8000/api/v1
paths:
  /pedidos:
    post:
      summary: Lista todos os pedidos sendo preparados, entregues ou cancelados que ainda não foram consultados.
      operationId: listaPedidosEntregues
      tags:
        - pedidos
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DadosConsultaListaPedidos'
        required: true
      responses:
        '200':
          description: Uma lista de pedidos entregues que ainda não foram consultados.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PedidosEntregues'
        '422':
          description: Todos os erros possiveis nessa validação.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidacaoConsultaPedidosEntregues'
  /pedidos/{pedido_id}:
    get:
      summary: Consulta o dados do pedido que foi solicitado
      operationId: consultaPedido
      tags:
        - pedidos
      parameters:
        - in: header
          name: companyToken
          required: true
          schema:
            type: string
          description: Token da empresa necessário para autenticação
        - name: pedido_id
          in: path
          description: Código do pedido que deseja ser consultado
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Detalhes do pedido
          content:
            application/json:
              examples:
